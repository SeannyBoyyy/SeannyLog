<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SeannyLog — Progressive Overload Tracker</title>
<meta name="description" content="A no-nonsense PWA for tracking progressive overload. Log your split, see your last numbers, know exactly when to add weight.">
<meta name="theme-color" content="#1C1B1A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">SeannyLog</div>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </header>

  <main id="view-root">
    <section id="view-today" class="view"></section>
    <section id="view-progress" class="view hidden"></section>
    <section id="view-split" class="view hidden"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v20M6 7h12a2 2 0 0 1 0 4H6M6 13h8a2 2 0 0 1 0 4H6"></path></svg>
      <span>Today</span>
    </button>
    <button class="nav-btn" data-view="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"></path><path d="M7 16l4-6 4 3 5-8"></path></svg>
      <span>Progress</span>
    </button>
    <button class="nav-btn" data-view="split">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      <span>Split</span>
    </button>
  </nav>

  <div class="sheet-backdrop hidden" id="sheet-backdrop">
    <div class="sheet" id="sheet-content"></div>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>

<!--
  Script load order matters: these are plain scripts (no bundler, no
  modules) sharing one global scope. state.js must load first (it defines
  `state` and save()/load()) and ui.js must load last (it wires up nav
  buttons and calls renderAll() immediately).
-->
<script src="js/state.js"></script>
<script src="js/logic.js"></script>
<script src="js/render-today.js"></script>
<script src="js/render-progress.js"></script>
<script src="js/render-split.js"></script>
<script src="js/settings.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
