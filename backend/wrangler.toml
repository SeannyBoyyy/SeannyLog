name = "seannylog-reminders"
account_id = "0e19baeebb94f200f14664c287beaa31"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[triggers]
# Automatic reminders are paused. Keep empty unless resumption is authorized.
crons = []

[[d1_databases]]
binding = "DB"
database_name = "reminders"
database_id = "ff9d55e4-8633-4f52-912c-50892f8be78b"
migrations_dir = "migrations"

[vars]
# Exact production origin; keep the Pages /SeannyLog/ path on the frontend.
ALLOWED_ORIGINS = "https://seannyboyyy.github.io"
VAPID_SUBJECT = "https://github.com/SeannyBoyyy/SeannyLog"
# Set both VAPID keys with wrangler secret bulk .secrets/vapid.json.

[observability]
enabled = false
